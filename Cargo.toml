[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/dbcraft", "apps/dbcraft-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/dbcraf"

[workspace.dependencies]
# internal
dbcraft-core = { path = "crates/core" }
dbcraft-driver = { path = "crates/driver" }
dbcraft-engine = { path = "crates/engine" }
dbcraft-ui-egui = { path = "crates/ui-egui" }

# craft-libs (immutable git rev)
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "1b9cf1973a11667396bc6675e836a9616dc322b7", features = ["serde"] }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "1b9cf1973a11667396bc6675e836a9616dc322b7" }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "1b9cf1973a11667396bc6675e836a9616dc322b7" }

# external
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "mysql",
    "postgres",
    "sqlite",
    "chrono",
    "json",
] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wgpu",
] }
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
rfd = "0.15"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
